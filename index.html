<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hailuo AI - Clone</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#0b0b12;color:white}
nav{display:flex;justify-content:space-between;padding:15px 20px}
.logo{font-size:22px;font-weight:bold}.logo span{color:#8b5cf6}
.nav-btn{background:#8b5cf6;color:white;border:none;padding:8px 16px;border-radius:20px;font-weight:bold}
.hero{text-align:center;padding:20px 15px 10px}.hero h1{font-size:28px}.hero h1 span{color:#8b5cf6}.hero p{color:#aaa;margin-top:10px;font-size:14px}
.tabs{display:flex;justify-content:center;gap:10px;margin:20px 0}.tabs button{background:#1e1e2e;color:white;border:1px solid #333;padding:10px 20px;border-radius:20px}.tabs button.active{background:white;color:black}
.card{background:#17171f;margin:0 15px;padding:15px;border-radius:15px}
.upload-box{display:flex;gap:10px}.upload{flex:1;background:#22222f;border:2px dashed #444;border-radius:12px;height:100px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font-size:13px;color:#aaa;text-align:center}.upload b{color:white;font-size:22px}
textarea{width:100%;background:#22222f;border:none;color:white;padding:12px;border-radius:12px;margin-top:12px;min-height:90px;outline:none}
.row{display:flex;justify-content:space-between;margin-top:12px;color:#aaa;font-size:13px}.row select{background:#22222f;color:white;border:none;padding:8px;border-radius:8px}
.gen{width:100%;background:#8b5cf6;color:white;border:none;padding:15px;border-radius:30px;font-size:16px;font-weight:bold;margin-top:15px}
.result{margin:15px;background:#111;border-radius:15px;min-height:260px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#666;text-align:center}
.result img{width:100%;height:100%;object-fit:cover;display:none;position:absolute;inset:0}
.result.playing img{display:block;animation:zoom 6s ease-in-out infinite alternate}
@keyframes zoom{from{transform:scale(1) translateX(0)}to{transform:scale(1.15) translateX(-10px)}}
.spark{position:absolute;font-size:28px;animation:float 1.2s ease-in-out infinite alternate;display:none}
@keyframes float{from{transform:translateY(0);opacity:.4}to{transform:translateY(-15px);opacity:1}}
.result.playing .spark{display:block}
.s1{top:15%;left:10%}.s2{top:25%;right:12%}.s3{bottom:20%;left:20%}
.status{position:absolute;bottom:10px;left:0;right:0;text-align:center;background:rgba(0,0,0,.6);padding:8px;font-size:13px;color:white;z-index:5}
.note{text-align:center;color:#777;font-size:12px;padding:0 20px 20px}
</style>
</head>
<body>
<nav><div class="logo">Hailuo <span>AI</span></div><button class="nav-btn">Get App</button></nav>
<div class="hero"><h1>Create Stunning Videos<br><span>With AI</span></h1><p>Turn your Aloo image into a magical video in seconds</p></div>
<div class="tabs"><button>Text to Video</button><button class="active">Img to Video</button></div>
<div class="card">
<div class="upload-box">
<label class="upload" for="fileInput"><b>+</b>Start Frame<br>Tap to upload</label>
<label class="upload" for="fileInput"><b>+</b>End Frame<br>Optional</label>
<input type="file" id="fileInput" accept="image/*" hidden>
</div>
<textarea id="prompt">Big potato character watering a magical plant, water drops falling, golden sparkles glowing, small potato character pointing and laughing, warm morning sunlight in a cozy farmhouse garden, smooth motion, cinematic</textarea>
<div class="row"><span>Model: Hailuo 01</span><select><option>Hailuo 01 - 720p</option><option>Hailuo 01-Live</option></select></div>
<div class="row"><span>Duration: 6s</span><span>Credits: 10</span></div>
<button class="gen" onclick="makeVideo()">✨ Generate Video - 10 Credits</button>
</div>
<div class="result" id="result">
<span id="resultText">Your video will appear here</span>
<img id="previewImg">
<div class="spark s1">✨</div><div class="spark s2">💧</div><div class="spark s3">✨</div>
<div class="status" id="statusText" style="display:none">▶ Playing - Aloo Video - 6s</div>
</div>
<p class="note">Demo - Photo animation effect. Real AI video needs paid API.</p>
<script>
let imgUrl="";
document.getElementById('fileInput').addEventListener('change',function(e){
let f=e.target.files[0];
if(f){imgUrl=URL.createObjectURL(f);let img=document.getElementById('previewImg');img.src=imgUrl;img.style.display='block';document.getElementById('resultText').style.display='none';document.getElementById('result').classList.remove('playing');}
});
function makeVideo(){
if(!imgUrl){alert('Pehle Aloo wali photo upload karo bhai!');return;}
let st=document.getElementById('statusText');st.style.display='block';st.innerText='⏳ Video ban rahi hai... 3 sec ruko...';
document.getElementById('result').classList.remove('playing');
setTimeout(()=>{document.getElementById('result').classList.add('playing');st.innerText='▶ Playing - Aloo Video - 6s - Hil rahi hai!';},3000);
}
</script>
</body>
</html>
